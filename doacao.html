<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagamento</title>

    <link rel="stylesheet" href="css/css.css">
</head>

<body>

    <header>
        <h1>Pagamento</h1>

        <nav>
            <a href="index.html">Inicío</a>
        </nav>
    </header>

    <main>

        <section class="form-container">

            <h2>Realizar pagamento</h2>

            <form id="paymentForm"
                  action="/pagto"
                  method="POST">

                <div class="form-group">

                    <label for="codigo">
                        Código:
                    </label>

                    <input
                        type="text"
                        id="codigo"
                        name="codigo"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        required
                    >

                    <small>
                        Digite exatamente 6 números.
                    </small>

                </div>


                <div class="form-group">

                    <label for="valor">
                        Valor:
                    </label>

                    <input
                        type="number"
                        id="valor"
                        name="valor"
                        min="0.01"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <p>Tipo de pagamento:</p>

                    <label>
                        <input
                            type="radio"
                            name="tipo"
                            value="0"
							checked
                            required
                        >
                        Pix
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="tipo"
                            value="1"
                        >
                        Debit
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="tipo"
                            value="2"
                        >
                        Credit
                    </label>

                </div>


                <button type="submit">
                    Processar pagamento
                </button>

            </form>

            <div id="message"></div>

        </section>

    </main>

<footer>
        <p>&copy; 2026 patinhas livres projeto academico</p>
</footer>

    <script src="js/script.js"></script>

</body>

</html>
