<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/css.css">
    <title>Patinhas Livres</title>
</head>
<body>

    <header>  
        <h1>Patinhas Livres</h1>
        <nav>
            <ul>
                <li><a href="sobre.html">Quem Somos</a></li>
                <li><a href="adocao">Adoção</a></li>
                <li><a href=docao.thml>Faça uma doação</a></li>
                <li><a href="Projetos.html">Projetos</a></li>
            </ul>
        </nav>

    <h1>Aplicação DOAÇÃO</h1>

    <form action="/pagto" method="POST">

        <label for="codigo">Cod. do benfeitor:</label><br>
        <input type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" name="codigo" required>
        <br><br>

        <label for="valor">Valor:</label><br>
        <input 
  type="number" 
  id="currency" 
  name="valor" 
  min="5.00" 
  step="0.50" 
  inputmode="decimal" 
  placeholder="0.00"
  required
>
        <br><br>
		<p>Selecione o método de doação:</p>
  
  <input type="radio" id="pix" name="meio" value="pix" checked>
  <label aria-label="PIX payment option" for="pix">PIX</label><br>

  <input type="radio" id="debito" name="meio" value="debito">
  <label aria-label="Débito payment option" for="debito">Débito</label><br>

  <input type="radio" id="credito" name="meio" value="credito">
  <label aria-label="Crédito payment option" for="credito">Crédito</label>
<br><br>
        <button type="submit">Submit</button>

    </form>

</body>

</html>
